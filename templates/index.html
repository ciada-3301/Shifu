<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shifu — AI Assistant</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

  <!-- Markdown + Pygments -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🥷</span>
          <span class="logo-text">Shifu</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New conversation
      </button>

      <div class="convo-list" id="convoList">
        <!-- Dynamically populated -->
      </div>

      <div class="sidebar-footer">
        <div class="model-badge">
          <span class="model-dot"></span>
          <span class="model-name">gemma4:31b · ollama</span>
        </div>
        <div class="sidebar-hint">Powered by CrewAI</div>
      </div>
    </aside>

    <!-- ═══ MAIN CHAT ═══ -->
    <main class="chat-main" id="chatMain">

      <!-- Top bar -->
      <header class="chat-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <div class="chat-title" id="chatTitle">New conversation</div>
        <div class="header-actions">
          <button class="icon-btn" id="clearBtn" title="Clear chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div class="messages-container" id="messagesContainer">
        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">🥷</div>
          <h1 class="welcome-title">Shifu is ready</h1>
          <p class="welcome-sub">Your personal AI assistant, powered by CrewAI agents.<br/>Ask anything — search the web, read files, browse directories.</p>
          <div class="welcome-chips">
            <button class="chip" data-prompt="Search the web for the latest AI news today">🔍 Latest AI news</button>
            <button class="chip" data-prompt="List the files in my current directory">📁 Browse directory</button>
            <button class="chip" data-prompt="Write a Python function to read a PDF and extract text">🐍 Python snippet</button>
            <button class="chip" data-prompt="Explain the difference between RAG and fine-tuning">🧠 RAG vs fine-tuning</button>
          </div>
        </div>
      </div>

      <!-- File preview bar (shows attached files above input) -->
      <div class="file-preview-bar" id="filePreviewBar"></div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-glass">

          <!-- Attachment button -->
          <button class="attach-btn" id="attachBtn" title="Attach file (PDF, image, text)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv" hidden />

          <!-- Textarea -->
          <textarea
            id="messageInput"
            placeholder="Ask Shifu anything…"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>

          <!-- Send button -->
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Shifu uses CrewAI agents · Supports PDF, images & documents</p>
      </div>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
