# Shifu Task Definitions — lean and direct.
# Context chaining (context= in crew.py) passes previous task
# outputs automatically. No need for template variables.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

research_task:
  description: >
    Research the following request using web search:

    USER REQUEST: {user_input}

    Instructions:
    - Run targeted, varied web searches (not the same phrase rephrased)
    - Every finding must have a source URL — no source means no finding
    - Prioritise official docs, GitHub repos, and primary sources
    - Extract concrete facts: dates, versions, code snippets, measurements
    - If you can't find something after 3 different queries, mark it UNRESOLVED
    - Keep output concise and structured for the next agent to act on
  expected_output: >
    A concise research report with verified findings and source URLs.
    Include an UNRESOLVED section for anything that couldn't be confirmed.

filesystem_task:
  description: >
    Handle file operations for this request:

    USER REQUEST: {user_input}
    PLAYGROUND: {playground_dir}

    If this is a CONTENT/WRITING task (no code execution needed):
    - Take the research context and synthesise it into polished content
    - Write the final deliverable to the playground directory
    - Read the file back to verify it was written correctly
    - Report the confirmed file path

    If this is a CODING task (code will be executed by Tigress):
    - Read any relevant existing files
    - Map the directory structure
    - Write scaffolding files (requirements, configs, stubs)
    - Prepare a brief context summary for Tigress

    Always verify file writes by reading back. Never report a file
    as saved without confirming it exists.
  expected_output: >
    A brief report of file operations performed, files written with
    confirmed paths, and verification status. If preparing for code
    execution, include a context summary for the next agent.

execution_task:
  description: >
    Execute code for this request:

    USER REQUEST: {user_input}
    PLAYGROUND: {playground_dir}

    Follow this loop:
    1. UNDERSTAND — Read the context from previous steps fully
    2. INSTALL — Install required packages, verify each install
    3. WRITE — Write minimal code to test core logic (write to file first)
    4. RUN — Execute via Terminal tool, read ALL stdout and stderr
    5. ASSESS — Compare output against what the user asked for
    6. FIX OR COMPLETE — Error? Diagnose, fix, go to step 4. Success? Done.

    All work goes inside {playground_dir}. No exceptions.
    "No error" does not mean "correct" — verify the output is right.
  expected_output: >
    A brief execution report: what was built, commands run, final output,
    and whether the user's request was fulfilled. Include file paths for
    any code or output produced.